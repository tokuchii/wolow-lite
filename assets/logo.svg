<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1E"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF"/>
      <stop offset="100%" style="stop-color:#0070E0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Outer ring - subtle border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#38383A" stroke-width="1"/>
  
  <!-- Power button circle -->
  <circle cx="256" cy="240" r="88" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Power button line -->
  <line x1="256" y1="152" x2="256" y2="208" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Signal waves - left -->
  <path d="M 160 310 Q 120 350 160 390" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130 290 Q 80 350 130 410" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 100 270 Q 40 350 100 430" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
  
  <!-- Signal waves - right -->
  <path d="M 352 310 Q 392 350 352 390" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 382 290 Q 432 350 382 410" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 412 270 Q 472 350 412 430" fill="none" stroke="#0A84FF" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
  
  <!-- WOLOW text -->
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="8" fill="#E5E5E5">WOLOW</text>
</svg>